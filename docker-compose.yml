version: '3.9'


services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: demeter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: demeter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demeter123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgress/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-boot:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: demeter_java_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: demeter_python
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    volumes:
      - ./python-service:/app


volumes:
  postgres_data:
